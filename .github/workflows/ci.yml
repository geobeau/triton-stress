name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these checks before publishing

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            pkg/tensorgen/go.sum
      - run: make lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (pkg/tensorgen)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: pkg/tensorgen
      - run: make test
      - run: make race
